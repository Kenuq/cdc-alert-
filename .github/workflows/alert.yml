name: CDC ActionZone 24/7 Cloud Alert

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CDC Signal Check
        run: python main.py
